policy_id: t3research-local-coding
name: T3Research local coding guard
version: 1
status: approved
mode: enforcement

scope:
  tool_names: [bash, shell, run_command]
  tool_groups: [shell]

rules:
  - rule_id: deny-recursive-delete-system-path
    rule_type: regex
    conditions:
      and:
        - field: parameters.command
          operator: regex
          value: '(^|[\s;&|(])(\S+/)?rm(\s|$)'
        - field: parameters.command
          operator: regex
          value: "(--recursive|-[a-zA-Z]*[rR])"
        - field: parameters.command
          operator: regex
          value: '(\s|["''=])(/\*?|/(bin|boot|dev|etc|home|lib|lib64|opt|proc|root|sbin|srv|sys|usr|var)/?|\$\{?HOME\}?|~)(\s|["'';&|]|$)'
    effect: deny
    citation:
      excerpt: "Recursive deletion of a system or home path is never permitted."

  - rule_id: review-recursive-or-forced-delete
    rule_type: regex
    conditions:
      and:
        - field: parameters.command
          operator: regex
          value: '(^|[\s;&|(])(\S+/)?rm(\s|$)'
        - or:
            - field: parameters.command
              operator: regex
              value: "(--recursive|-[a-zA-Z]*[rR])"
            - field: parameters.command
              operator: regex
              value: "(--force|-[a-zA-Z]*f)"
    effect: escalate
    citation:
      excerpt: "Recursive or forced deletion requires human review."

  - rule_id: review-git-history-or-publish
    rule_type: regex
    conditions:
      field: parameters.command
      operator: regex
      value: '\bgit\s+(push\b|reset\s+--hard|clean\b[^|;&]*\s-[a-zA-Z]*f|rebase\b|filter-repo|filter-branch|update-ref\s+-d|branch\s+-D)'
    effect: escalate
    citation:
      excerpt: "Publishing or rewriting Git history requires human review."

  - rule_id: review-github-public-actions
    rule_type: regex
    conditions:
      field: parameters.command
      operator: regex
      value: '\b(gh|hub)\s+(repo\s+(create|delete|edit\s+--visibility)|pr\s+(create|merge|close)|issue\s+(create|close|transfer)|release\s+create|api\s+)'
    effect: escalate
    citation:
      excerpt: "GitHub public actions (create/merge PRs, create/close issues, create repos/releases, API calls) require human review."

  - rule_id: review-npm-publish
    rule_type: regex
    conditions:
      field: parameters.command
      operator: regex
      value: '\bnpm\s+publish\b|\byarn\s+publish\b|\bpnpm\s+publish\b'
    effect: escalate
    citation:
      excerpt: "Publishing packages to npm requires human review."

  - rule_id: deny-env-secrets-exfiltration
    rule_type: regex
    conditions:
      and:
        - field: parameters.command
          operator: regex
          value: '(env|printenv|set)\b|(\$\{?[A-Z_]*KEY|TOKEN|SECRET|PASSWORD|CREDENTIAL)'
        - field: parameters.command
          operator: regex
          value: '\b(curl|wget|nc|ncat|ssh|scp|rsync)\b|\|'
    effect: deny
    citation:
      excerpt: "Piping environment variables or secrets to network commands is never permitted."

  - rule_id: review-docker-privileged
    rule_type: regex
    conditions:
      field: parameters.command
      operator: regex
      value: '\bdocker\s+(run|exec)\b.*--privileged|\bdocker\s+system\s+prune\b'
    effect: escalate
    citation:
      excerpt: "Running privileged Docker containers or system prune requires human review."
